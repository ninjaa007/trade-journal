name: Build Signed Android AAB for Play Store

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Signed Google Play Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App
        run: |
          cordova create cordova-app com.trade1percent.journal "Trade1Percent"
          cd cordova-app
          # Remove default template files
          rm -rf www/*
          # Copy our updated frontend files (with the correct Vercel URL)
          cp -r ../public/* www/
          # Copy build.json and keystore inside cordova-app for automatic signing
          cp ../build.json .
          cp ../release.keystore .

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle 7.6 (Force Cordova Compatibility)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6

      - name: Add Android Platform & Build Signed AAB
        run: |
          cd cordova-app
          cordova platform add android@11.0.0
          # This will automatically pick up build.json, sign the app, and compile it as a .aab bundle!
          cordova build android --release

      - name: Upload Signed Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Trade1Percent-GooglePlay-Bundle
          path: cordova-app/platforms/android/app/build/outputs/bundle/release/app-release.aab
